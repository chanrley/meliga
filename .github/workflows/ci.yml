name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format check (Prettier)
        run: npx --yes prettier --check "**/*.{html,css,js,md}"

      - name: HTML lint (HTMLHint)
        run: npx --yes htmlhint "**/*.html"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empacotar site estático
        run: |
          mkdir dist
          cp index.html dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
